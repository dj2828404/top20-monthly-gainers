name: Update gainers

on:
  # Runs only when you press "Run workflow" on the Actions tab.
  # To make it automatic again, add a schedule here, for example 20:00 India time on weekdays:
  #   schedule:
  #     - cron: "30 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gainers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run the update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update.py

      - name: Save the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update gainers data"
            git push
          fi
